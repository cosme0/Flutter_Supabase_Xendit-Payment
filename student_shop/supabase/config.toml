# Supabase configuration for the student shop (BMC finals project).
#
# Project : BMC-ecom1
# Org     : BMC
#
# This file is used by the Supabase CLI (`supabase start`, `supabase link`,
# `supabase functions deploy`). The dashboard project settings are the source
# of truth - keep both in sync.

project_id = "BMC-ecom1"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["flutter://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# The shop signs in anonymously so that every order belongs to a real
# auth.uid() and the Row Level Security policies of the `orders` table apply.
# If anonymous sign-ins are disabled in the dashboard the app automatically
# falls back to the guest checkout (server issued guest token).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions]
# Default for every function of this project.
# NOTE: the functions below override this value.
verify_jwt = true

[functions.create-invoice]
# The platform level JWT check is disabled because the function must also be
# able to serve guest checkouts. The function performs its own authorization:
#   * when an `Authorization: Bearer <jwt>` header is present the JWT is
#     verified server side against Supabase Auth and an invalid token is
#     rejected with 401
#   * otherwise the caller is a guest and receives a high entropy token that
#     is generated by the server (only its SHA-256 hash is stored)
# Set this back to `true` to only allow signed in customers.
verify_jwt = false

[functions.xendit-webhook]
# MUST stay `false`: Xendit calls this endpoint server to server and does not
# send a Supabase JWT. The function validates the `x-callback-token` header
# against the XENDIT_WEBHOOK_TOKEN secret instead - without that token
# anybody could mark an order as PAID.
verify_jwt = false
